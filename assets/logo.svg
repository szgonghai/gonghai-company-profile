<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Microsoft YaHei, sans-serif">
  <rect width="400" height="200" fill="#fff"/>
  
  <!-- 主标识（红色方块 + 白色图案）-->
  <rect x="20" y="20" width="120" height="120" fill="#C00000" rx="8"/>
  
  <!-- 白色图案（抽象的弓 + 海浪）-->
  <path d="M 40 50 Q 80 30 120 50" stroke="white" stroke-width="4" fill="none"/>
  <path d="M 40 70 Q 80 50 120 70" stroke="white" stroke-width="4" fill="none"/>
  <path d="M 40 90 Q 80 70 120 90" stroke="white" stroke-width="4" fill="none"/>
  <circle cx="80" cy="110" r="6" fill="white"/>
  <circle cx="100" cy="115" r="4" fill="white"/>
  <circle cx="60" cy="115" r="4" fill="white"/>
  
  <!-- 中文 -->
  <text x="160" y="70" fill="#C00000" font-size="40" font-weight="bold">弓海</text>
  <text x="160" y="110" fill="#495057" font-size="20" font-weight="bold">SZKH</text>
  <text x="160" y="135" fill="#666" font-size="13">苏州弓海贸易</text>
  
  <!-- 英文 -->
  <text x="20" y="170" fill="#666" font-size="11">SUZHOU GONGHAI TRADING CO., LTD</text>
  <text x="20" y="185" fill="#666" font-size="10">Industrial Fluid Equipment Solutions</text>
</svg>
